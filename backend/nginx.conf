worker_processes 1;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    
    # Temp paths for non-root user
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Increase timeouts for long-running connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Cloud Run injects PORT env variable
        listen 8080;
        server_name _;

        # WebSocket endpoint for Gemini Live API (CRITICAL for form-filling)
        location /ws {
            proxy_pass http://127.0.0.1:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API endpoints - proxy to FastAPI
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CORS proxy for Nurix widget API (api-in.nurixlabs.tech)
        location /nurix-proxy/ {
            proxy_pass http://127.0.0.1:8000/nurix-proxy/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CORS proxy for the agentX platform host (agentx-prod.nurixlabs.tech) —
        # outbound phone call, transcript, call status. Without this location
        # nginx answers /agentx-proxy/* with the `location /` health fallback.
        location /agentx-proxy/ {
            proxy_pass http://127.0.0.1:8000/agentx-proxy/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Agent tool call endpoints (AgentX/VoiceX integration)
        location /agent/ {
            proxy_pass http://127.0.0.1:8000/agent/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket proxy for noVNC (browser viewing).
        # NOTE: websockify (started with `--web ... 6080 localhost:5900`, no --path) upgrades the
        # VNC WebSocket at its ROOT. Proxying to `.../websockify` makes websockify's file-server
        # look for a file named "websockify" and return 404, so the noVNC panel never connects
        # (blank/"disconnected"). Proxy to root `6080/` instead — same target `/vnc/` uses — so a
        # real browser WS upgrade succeeds. Trailing slash on proxy_pass strips the /websockify prefix.
        location /websockify {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # noVNC static files and web interface
        location /vnc/ {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check for Cloud Run
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Swagger UI
        location /docs {
            proxy_pass http://127.0.0.1:8000/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:8000/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Root - show simple info or redirect to VNC
        location / {
            return 200 '{"status": "ok", "service": "form-filling-ai-backend", "vnc": "/vnc/vnc.html", "ws": "/ws"}';
            add_header Content-Type application/json;
        }
    }
}
